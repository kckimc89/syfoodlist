// IndexedDB keeps photos outside LocalStorage. Metadata stays tiny, preventing quota failures.
const V25_PHOTO_DB="kids_food_photos_v25";
let v25PhotoDBPromise=null;
function v25OpenPhotoDB(){
 if(!window.indexedDB)return Promise.reject(new Error("IndexedDB 미지원"));
 if(v25PhotoDBPromise)return v25PhotoDBPromise;
 v25PhotoDBPromise=new Promise((resolve,reject)=>{const r=indexedDB.open(V25_PHOTO_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("photos"))r.result.createObjectStore("photos")};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("사진 저장소를 열 수 없습니다."))});
 return v25PhotoDBPromise;
}
function v25PutPhoto(id,dataUrl){return v25OpenPhotoDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction("photos","readwrite");tx.objectStore("photos").put(dataUrl,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("사진 저장 실패"))}))}
function v25GetStoredPhoto(id){return v25OpenPhotoDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction("photos","readonly"),r=tx.objectStore("photos").get(id);r.onsuccess=()=>resolve(r.result||"");r.onerror=()=>reject(r.error)}))}
function v25DeletePhoto(id){return v25OpenPhotoDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction("photos","readwrite");tx.objectStore("photos").delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)}))}

function v25CompressImage(file,maxSide=900,maxBytes=180000){
 return new Promise((resolve,reject)=>{
  if(!file){reject(new Error("사진 파일이 없습니다."));return}
  const r=new FileReader();r.onerror=()=>reject(new Error("사진을 읽을 수 없습니다."));r.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error("사진을 읽을 수 없습니다."));im.onload=()=>{let scale=Math.min(1,maxSide/Math.max(im.width,im.height));let w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale));const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);let q=.78;const loop=()=>c.toBlob(b=>{if(!b){reject(new Error("사진 압축 실패"));return}if(b.size<=maxBytes||q<=.32){const rr=new FileReader();rr.onload=()=>resolve(rr.result);rr.onerror=()=>reject(new Error("사진 변환 실패"));rr.readAsDataURL(b)}else{q-=.08;loop()}},"image/jpeg",q);loop()};im.src=r.result};r.readAsDataURL(file)
 })
}

/* ===== V25 STABLE EXTENSIONS ===== */
const V25_CATEGORY_KEY = "kids_food_categories_v25";
const V25_MAX_SIDE = 1000;
const V25_MAX_BYTES = 650000;

function v25SafeSave(){
  try{
    localStorage.setItem(KEY, JSON.stringify(data));
    return true;
  }catch(e){
    alert("저장공간이 부족합니다.\n사진은 자동으로 작게 압축되지만, 기존 사진이 너무 많으면 일부를 삭제하거나 백업 후 정리해 주세요.");
    return false;
  }
}

function v25CompressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file){ reject(new Error("사진 파일이 없습니다.")); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("사진을 읽을 수 없습니다."));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("사진 형식을 읽을 수 없습니다."));
      img.onload = ()=>{
        const scale = Math.min(1, V25_MAX_SIDE / Math.max(img.width,img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);

        let quality = 0.78;
        const attempt = ()=>{
          canvas.toBlob(blob=>{
            if(!blob){ reject(new Error("사진 압축에 실패했습니다.")); return; }
            if(blob.size <= V25_MAX_BYTES || quality <= 0.34){
              const out = new FileReader();
              out.onerror = ()=>reject(new Error("사진 저장용 변환에 실패했습니다."));
              out.onload = ()=>resolve(out.result);
              out.readAsDataURL(blob);
            }else{
              quality -= 0.08;
              attempt();
            }
          },"image/jpeg",quality);
        };
        attempt();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function removeCategory(name,foodId){

function v251CompressImage(file,maxSide=900,maxBytes=180000){
  return new Promise((resolve,reject)=>{
    if(!file){reject(new Error("사진 파일이 없습니다."));return}
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("사진을 읽을 수 없습니다."));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("사진 형식을 읽을 수 없습니다."));
      img.onload=()=>{
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);
        let q=.82;
        const attempt=()=>c.toBlob(blob=>{
          if(!blob){reject(new Error("사진 압축에 실패했습니다."));return}
          if(blob.size<=maxBytes || q<=.28){
            const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error("사진 변환에 실패했습니다."));r.readAsDataURL(blob)
          }else{q-=.08;attempt()}
        },"image/jpeg",q);
        attempt();
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function v251StorePhoto(id,dataUrl){
  await v251PutPhoto(id,dataUrl);
  const f=data.find(x=>x.id===id);if(f)f.photo="idb:"+id;

}

}
async function takePhoto(id){
  const video=$("cameraVideo"),canvas=$("cameraCanvas");
  if(!video||!video.videoWidth){alert("카메라가 아직 준비되지 않았습니다.");return}
  let w=video.videoWidth,h=video.videoHeight,max=900;
  if(w>max){h=Math.round(h*max/w);w=max}
  canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(video,0,0,w,h);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.82));
  if(!blob){alert("사진 생성에 실패했습니다.");return}
  try{
    const file=new File([blob],"camera.jpg",{type:"image/jpeg"});
    await handlePhotoFile(id,file);
    stopCamera();
  }catch(e){console.error(e);alert("사진 저장에 실패했습니다. 다시 촬영해 주세요.")}
}

function v251FillKnowledge(){
  let changed=false;
  data.forEach(f=>{
    const k=V251_KNOWLEDGE[f.name];if(!k)return;
    const fields=["desc","ing","how","health","tip"];
    fields.forEach((key,i)=>{if(!String(f[key]||"").trim()){f[key]=k[i];changed=true}});
  });
  if(changed)v251SafeSave();
}

async function render(){
  renderFilters();
  let list=category==="전체"?data:category==="__FAVORITES__"?data.filter(f=>!!f.favorite):data.filter(f=>(f.cat||"미분류")===category);
  const q=(document.getElementById("v25SearchInput")?.value||"").trim().toLowerCase();
  if(q)list=list.filter(f=>[f.name,f.ing,f.desc,f.tip,f.health,f.how].some(v=>String(v||"").toLowerCase().includes(q)));
  $("grid").innerHTML=list.length?list.map(f=>`<div class="card" onclick="detail('${f.id}')"><button type="button" class="favStar" onclick="event.stopPropagation();toggleFavorite('${f.id}')">${f.favorite?"⭐":"☆"}</button><div class="pic" id="pic-${f.id}">${f.photo?"<span>📷</span>":`<div>🍴<br><span style="font-size:13px">📷 사진을 등록해 보세요</span></div>`}</div><div class="ct"><div class="name">${esc(f.name)}</div><div class="cat">${esc(f.cat||"미분류")}</div></div></div>`).join(""):`<div class="empty">아직 음식이 없어요.</div>`;
  for(const f of list){
    if(!f.photo)continue;
    try{const src=await v251GetPhoto(f);const el=document.getElementById("pic-"+f.id);if(el&&src)el.innerHTML=`<img src="${src}" alt="${esc(f.name)}" loading="lazy">`;}catch(e){console.warn("photo render",f.id,e)}
  }
}
async function detail(id){

<script>
/* V27: whole-dictionary backup/restore.
   Keeps the existing V26 food/localStorage and IndexedDB photo stores. */
const V27_BACKUP_VERSION="1";
const V27_BACKUP_MARKER="V27_BACKUP_START";

function v27FindPhotoDB(){
  return window.FOOD_PHOTO_DB || window.PHOTO_DB || "KidsFoodPhotos";
}
function v27FindPhotoStore(){
  return window.FOOD_PHOTO_STORE || window.PHOTO_STORE || "photos";
}
function v27OpenPhotoDB(){
  return new Promise((resolve,reject)=>{
    if(!indexedDB){reject(new Error("이 브라우저는 IndexedDB를 지원하지 않습니다."));return}
    const req=indexedDB.open(v27FindPhotoDB());
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("사진 저장소를 열 수 없습니다."));
  });
}
function v27BlobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    if(typeof blob==="string"){resolve(blob);return}
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(r.error||new Error("사진 변환 실패"));
    r.readAsDataURL(blob);
  });
}
async function v27ReadAllPhotos(){
  const db=await v27OpenPhotoDB();
  const storeName=v27FindPhotoStore();
  if(!db.objectStoreNames.contains(storeName)){db.close();return {}}
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,"readonly");
    const store=tx.objectStore(storeName);
    const out={};
    const req=store.openCursor();
    req.onsuccess=async e=>{
      const c=e.target.result;
      if(!c){db.close();resolve(out);return}
      try{out[String(c.key)]=await v27BlobToDataURL(c.value?.blob??c.value)}catch(_){}
      c.continue();
    };
    req.onerror=()=>{db.close();reject(req.error)};
  });
}
async function v27WritePhoto(id,dataUrl){
  const db=await v27OpenPhotoDB();
  const storeName=v27FindPhotoStore();
  if(!db.objectStoreNames.contains(storeName)){db.close();return false}
  const blob=await (await fetch(dataUrl)).blob();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,"readwrite");
    const store=tx.objectStore(storeName);
    // Preserve common V26 shapes; otherwise store the Blob directly.
    let value=blob;
    if(store.keyPath){ value={id:id,blob:blob}; }
    try{
      if(store.keyPath) store.put(value);
      else store.put(blob,id);
    }catch(e){db.close();reject(e);return}
    tx.oncomplete=()=>{db.close();resolve(true)};
    tx.onerror=()=>{db.close();reject(tx.error||new Error("사진 저장 실패"))};
  });
}
async function v27Backup(){
  try{
    const photos=await v27ReadAllPhotos();
    const payload={
      app:"어린이 음식도감",
      version:"V27",
      createdAt:new Date().toISOString(),
      origin:location.origin,
      foods:(typeof data!=="undefined"?data:[]),
      categories:(typeof getCategories==="function"?getCategories():[]),
      photos
    };
    const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`어린이음식도감_백업_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alert(`백업 파일을 만들었습니다.\n음식 ${payload.foods.length}개 · 사진 ${Object.keys(photos).length}개`);
  }catch(e){
    alert("백업 중 문제가 발생했습니다.\n"+(e.message||e));
  }
}
async function v27RestoreFile(file){
  const text=await file.text();
  const p=JSON.parse(text);
  if(!p || p.app!=="어린이 음식도감" || !Array.isArray(p.foods)){
    throw new Error("올바른 어린이 음식도감 백업 파일이 아닙니다.");
  }
  if(!confirm(`백업을 복원할까요?\n음식 ${p.foods.length}개 · 사진 ${Object.keys(p.photos||{}).length}개\n현재 데이터에 백업 데이터를 합칩니다.`))return;
  if(typeof data==="undefined")throw new Error("음식 데이터 저장소를 찾을 수 없습니다.");

  const byId=new Map(data.map(x=>[String(x.id),x]));
  p.foods.forEach(f=>byId.set(String(f.id),f));
  data.splice(0,data.length,...byId.values());
  if(typeof save==="function")save();

  if(Array.isArray(p.categories) && typeof saveCategories==="function")saveCategories(p.categories);
  let restored=0, failed=0;
  for(const [id,src] of Object.entries(p.photos||{})){
    try{if(await v27WritePhoto(id,src))restored++;else failed++}catch(_){failed++}
  }
  if(typeof render==="function")render();
  alert(`복원이 완료되었습니다.\n음식 ${p.foods.length}개 · 사진 ${restored}개`+(failed?`\n사진 ${failed}개는 복원하지 못했습니다.`:""));
}
function v27PickRestore(){
  const i=document.createElement("input");
  i.type="file"; i.accept=".json,application/json";
  i.onchange=async()=>{if(!i.files?.[0])return;try{await v27RestoreFile(i.files[0])}catch(e){alert("복원 실패: "+(e.message||e))}};

}

<script>
/* ===== V29 DATA-PRESERVATION LAYER =====
   Do not change the existing V25 IndexedDB database name. This is deliberate:
   existing V25/V26/V27 photos remain in the same database on the same origin.
*/
const V29_SHADOW_KEY="kids_food_v28_shadow";
const V29_VERSION="V29";

function v28CloneFoods(){
  return JSON.parse(JSON.stringify(Array.isArray(data)?data:[]));
}
function v28WriteShadow(){
  try{
    const slim=v28CloneFoods().map(f=>{const x={...f};
      // Never put a data URL into the shadow copy; photos live in IndexedDB.
      if(x.photo && String(x.photo).startsWith("data:")) x.photo="idb:"+x.id;
      return x;
    });
    localStorage.setItem(V29_SHADOW_KEY,JSON.stringify(slim));
    return true;
  }catch(e){console.warn("V29 shadow save failed",e);return false}
}
function v28ReadShadow(){
  try{const x=JSON.parse(localStorage.getItem(V29_SHADOW_KEY)||"[]");return Array.isArray(x)?x:[]}catch(e){return []}
}
async function v28RecoverIfPrimaryEmpty(){
  if(Array.isArray(data)&&data.length) return false;
  const shadow=v28ReadShadow();
  if(!shadow.length)return false;
  data=shadow;
  if(typeof v251SafeSave==="function")v251SafeSave(); else localStorage.setItem(KEY,JSON.stringify(data));
  return true;
}
async function v28MigrateAllInlinePhotos(){
  let changed=false, migrated=0;

    if(f.photo && String(f.photo).startsWith("data:")){

        f.photo="idb:"+f.id;
        changed=true; migrated++;
      }catch(e){console.warn("V29 photo migration failed",f.id,e)}
    }
  }
  if(changed && typeof v251SafeSave==="function")v251SafeSave();
  return migrated;
}

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
      '<button type="button" id="v29BackupDo">📦 전체 백업</button>'+
      '<button type="button" id="v29RestoreDo">📥 백업 복원</button>'+
      '<button type="button" id="v29StatusDo">📊 저장상태 확인</button>'+
      '</div>'+
      '<div style="margin-top:8px;font-size:12px;color:#666;line-height:1.45">음식·사진·카테고리·즐겨찾기·설명을 한 번에 보관합니다. 중요한 사진이 많다면 정기적으로 백업하세요.</div>';
    const wrap=document.createElement("div");
    wrap.id="v29BackupWrap";
    wrap.style.cssText="position:relative;display:inline-block;flex:1";
    const btn=document.getElementById("backupBtn");
    btn.parentNode.insertBefore(wrap,btn);
    wrap.appendChild(btn);
    wrap.appendChild(panel);
    panel.hidden=true;

    document.getElementById("v29BackupDo").onclick=async()=>{
      panel.hidden=true;
      if(typeof v28Backup==="function") await v28Backup();
      else if(typeof window.exportV25Backup==="function") await window.exportV25Backup();
    };
    document.getElementById("v29RestoreDo").onclick=()=>{
      panel.hidden=true;
      if(typeof v28PickRestore==="function") v28PickRestore();
      else if(typeof window.importV25Backup==="function"){
        const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
        i.onchange=()=>window.importV25Backup(i.files?.[0]);i.click();
      }
    };
    document.getElementById("v29StatusDo").onclick=()=>{
      panel.hidden=true;
      if(typeof v28StorageStatus==="function") v28StorageStatus();
      const n=(typeof data!=="undefined"&&Array.isArray(data))?data.length:0;
      alert("현재 도감 저장상태\\n\\n음식 "+n+"개\\n\\n사진은 각 음식에 저장된 사진을 기준으로 관리됩니다.");
    };
  }
  panel.hidden=!panel.hidden;
}
function installFinalUI(){
  const btn=document.getElementById("backupBtn");
  if(btn){
    btn.textContent="💾 백업";
    btn.onclick=(e)=>{e.preventDefault();e.stopPropagation();openBackupMenu()};
  }
  if(typeof updateParentButton==="function")updateParentButton();
}
window.addEventListener("load",()=>setTimeout(installFinalUI,100));
})();
</script>

<script>
/* ===== V29 FINAL STABLE BOOT ===== */
(function(){
"use strict";
async function boot(){
  try{
    const add=document.getElementById("addBtn");
    const parent=document.getElementById("parentBtn");
    const backup=document.getElementById("backupBtn");

    if(add && typeof window.saveAdd==="function"){
      add.onclick=e=>{e.preventDefault();window.saveAdd();};
    }else if(add && typeof window.v28SaveAdd==="function"){
      add.onclick=e=>{e.preventDefault();window.v28SaveAdd();};
    }

    if(parent && typeof window.parent==="function"){
      parent.onclick=e=>{e.preventDefault();window.parent();};
      window.updateParentButton && window.updateParentButton();
    }

    if(backup && typeof window.openBackupMenu==="function"){
      backup.onclick=e=>{e.preventDefault();e.stopPropagation();window.openBackupMenu();};
    }else if(backup && typeof window.exportV25Backup==="function"){
      backup.onclick=e=>{e.preventDefault();window.exportV25Backup();};
    }

    if(typeof window.v28Init==="function"){
      await window.v28Init();
    }else if(typeof window.initV25==="function"){
      await window.initV25();
      if(typeof window.render==="function")await window.render();
    }
    if(typeof window.updateParentButton==="function")window.updateParentButton();
  }catch(e){
    console.error("V29 boot error",e);
    alert("도감 초기화 중 문제가 발생했습니다. 페이지를 한 번 새로고침해 주세요.");
  }
}
window.addEventListener("load",()=>setTimeout(boot,300));
})();
</script>
