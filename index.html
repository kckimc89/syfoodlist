<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>어린이 음식도감 V16</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#fffaf2;color:#333}
header{padding:18px 16px;background:#ffe59a;text-align:center;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:25px} .sub{margin-top:5px;font-size:13px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
button{border:0;border-radius:14px;padding:12px 9px;background:#fff;font-weight:700;box-shadow:0 2px 8px #00000014}
button:active{transform:scale(.98)} .wrap{max-width:900px;margin:auto;padding:14px}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;background:#eee;border-radius:999px;padding:8px 12px}.chip.on{background:#333;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px #00000012}.pic{height:145px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;font-size:55px}.pic img{width:100%;height:100%;object-fit:cover}.ct{padding:11px}.name{font-weight:800;font-size:17px}.cat{font-size:12px;color:#777;margin-top:3px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font:inherit}.field textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;background:#222;color:#fff}.actions .alt{background:#eee;color:#333}
.infoBox,.learnbox{background:#eef7ff;border-radius:15px;padding:13px;font-size:13px;line-height:1.6;margin-top:10px}.learn{line-height:1.7}.learn h3{font-size:24px;margin:5px 0 12px}.section{margin:15px 0;padding-top:10px;border-top:1px solid #eee}.section h4{margin:0 0 6px}.detailPhoto{width:100%;max-height:360px;object-fit:cover;border-radius:18px;background:#eee}.empty{text-align:center;padding:45px 10px;color:#777}
.small{font-size:12px;color:#777}.danger{background:#e33!important;color:#fff!important}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{border-radius:22px}}

.photoChoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.photoBig{min-height:145px;background:#f7f7f7;border:2px solid #e5e5e5;box-shadow:none;font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.photoBig b{font-size:15px}.photoBig span{font-size:12px;font-weight:500;color:#777}
@media(max-width:430px){.photoChoice{grid-template-columns:1fr}.photoBig{min-height:120px}}
</style>
</head>

</div>
</header>

<div class="filters" id="filters"></div>
<div id="grid" class="grid"></div>
</div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>

alse,"place":"","feel":"","again":"","memo":""},{"id":"starter41","name":"호떡","cat":"간식","desc":"반죽 안에 달콤한 속을 넣어 구운 간식이에요.","ing":"","how":"","health":"","tip":"","photo":"","seen":false,"fav":false,"place":"","feel":"","again":"","memo":""},{"id":"starter42","name":"토스트","cat":"간식","desc":"빵을 구워 달걀이나 채소 등을 곁들여 먹는 음식이에요.","ing":"","how":"","health":"","tip":"","photo":"","seen":false,"fav":false,"place":"","feel":"","again":"","memo":""},{"id":"starter43","name":"샌드위치","cat":"간식","desc":"빵 사이에 채소나 고기 등을 넣어 먹는 음식이에요.","ing":"","how":"","health":"","tip":"","photo":"","seen":false,"fav":false,"place":"","feel":"","again":"","memo":""},{"id":"starter44","name":"계란말이","cat":"반찬","desc":"달걀을 풀어 여러 번 말아 익힌 반찬이에요.","ing":"","how":"","health":"","tip":"","photo":"","seen":false,"fav":false,"place":"","feel":"","again":"","memo":""},{"id":"starter45","name":"두부","cat":"반찬","desc":"콩으로 만든 부드러운 식품이에요.","ing":"","how":"","health":"","tip":"","photo":"","seen":false,"fav":false,"place":"","feel":"","again":"","memo":""},{"id":"starter46","name":"잡채","cat":"반찬","desc":"당면과 채소, 고기 등을 볶아 만든 음식이에요.","ing":"","how":"","health":"","tip":"","photo":"","seen":false,"fav":false,"place":"","feel":"","again":"","memo":""},{"id":"starter47","name":"김치","cat":"반찬","desc":"채소를 양념해 발효시킨 우리나라의 대표적인 음식이에요.","ing":"","how":"","health":"","tip":"","photo":"","seen":false,"fav":false,"place":"","feel":"","again":"","memo":""},{"id":"starter48","name":"김","cat":"반찬","desc":"김을 구워 밥과 함께 먹는 반찬이에요.","ing":"","how":"","health":"","tip":"","photo":"","seen":false,"fav":false,"place":"","feel":"","again":"","memo":""},{"id":"starter49","name":"옥수수","cat":"간식","desc":"알갱이를 먹는 대표적인 곡식이에요.","ing":"","how":"","health":"","tip":"","photo":"","seen":false,"fav":false,"place":"","feel":"","again":"","memo":""},{"id":"starter50","name":"고구마","cat":"간식","desc":"달콤하고 포근한 맛이 나는 뿌리채소예요.","ing":"","how":"","health":"","tip":"","photo":"","seen":false,"fav":false,"place":"","feel":"","again":"","memo":""},{"id":"starte let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
if(!Array.isArray(data))data=[];
base.forEach((b,i)=>{if(!data.some(x=>x.name===b.name)){data.push({...b,id:"b"+i,photo:"",seen:false,fav:false,place:"",feel:"",again:"",memo:""})}});
expandedStarterFoods.forEach(f=>{if(!data.some(x=>x.name===f.name)){data.push(f)}});
save();

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function openModal(content){$("sheet").innerHTML=content;$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()})

function renderFilters(){
 const cats=["전체",...new Set(data.map(x=>x.cat||"새로 발견한 음식"))];
 $("filters").innerHTML=cats.map(c=>`<button class="chip ${c===category?"on":""}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join("");
}
function setCat(c){category=c;render()}
function render(){
 renderFilters();
 const list=category==="전체"?data:data.filter(x=>(x.cat||"새로 발견한 음식")===category);
 $("grid").innerHTML=list.length?list.map(f=>`<div class="card" onclick="detail('${f.id}')">
 <div class="pic">${f.photo?`<img src="${f.photo}" alt="">`:`<div>🍴<br><span style="font-size:13px">📷 사진을 등록해 보세요</span></div>`}</div>
 <div class="ct"><div class="name">${esc(f.name)}</div><div class="cat">${esc(f.cat||"새로 발견한 음식")}</div></div>
 </div>`).join(""):`<div class="empty">아직 음식이 없어요.</div>`;
}
function detail(id){
 const f=data.find(x=>x.id===id); if(!f)return;
 openModal(`<div>${f.photo?`<img class="detailPhoto" src="${f.photo}" alt="">`:`<div class="pic" style="height:220px;border-radius:18px">🍴</div>`}</div>
 <div class="learn"><h3>${esc(f.name)}</h3>
 ${f.place||f.feel||f.again||f.memo?`<div class="learnbox"><b>👧 내가 기록한 이야기</b><br>📍 ${esc(f.place||"기록 없음")}<br>😋 ${esc(f.feel||"기록 없음")}<br>❤️ 다시 먹기: ${esc(f.again||"기록 없음")}<br>✏️ ${esc(f.memo||"기록 없음")}</div>`:""}
 ${section("음식 설명",f.desc||"아직 부모님 설명이 없어요.")}
 ${section("주재료",f.ing||"아직 알려주지 않았어요.")}
 ${section("어떻게 만들까요?",f.how||"아직 알려주지 않았어요.")}
 ${section("건강하게 먹는 법",f.health||"아직 알려주지 않았어요.")}
 ${section("💡 알아두면 좋은 점",f.tip||"아직 알려주지 않았어요.")}
 </div>
 <div class="actions">
 <button onclick="photoForFood('${f.id}')">📷 ${f.photo?"사진 바꾸기":"사진 등록"}</button>
 ${parentMode?`<button onclick="editFood('${f.id}')">✏️ 부모님 설명 수정</button><button class="danger" onclick="deleteFood('${f.id}')">🗑️ 삭제</button>`:""}
 <button class="alt" onclick="closeModal()">닫기</button>
</div>`);
}
function section(t,v){return `<div class="section"><h4>${t}</h4><div>${esc(v)}</div></div>`}

function addFood(){
 openModal(`<h2>➕ 새로운 음식 발견!</h2>
 <p>아이가 직접 먹어본 음식만 간단히 기록해 보세요.</p>
 <div class="field"><label>🍴 음식 이름</label><input id="a_name" placeholder="예: 마라탕"></div>
 <div class="field"><label>📷 음식 사진</label><input id="a_photo" type="file" accept="image/*" capture="environment"></div>
 <div class="field"><label>📍 어디서 먹었나요?</label><select id="a_place"><option>집</option><option>학교</option><option>학교 주변</option><option>식당</option><option>여행</option><option>기타</option></select></div>
 <div class="field"><label>😋 어떤 느낌이었나요?</label><select id="a_feel"><option>😋 아주 맛있었어요</option><option>🙂 맛있었어요</option><option>😐 보통이었어요</option><option>😖 별로였어요</option></select></div>
 <div class="field"><label>❤️ 다시 먹고 싶나요?</label><select id="a_again"><option>네</option><option>잘 모르겠어요</option><option>아니요</option></select></div>
 <div class="field"><label>✏️ 내가 한마디</label><textarea id="a_memo" placeholder="예: 조금 매웠지만 맛있었어요!"></textarea></div>
 <div class="infoBox">📚 <b>음식 지식은 나중에 부모님과 함께 채워요.</b><br>주재료·만드는 방법·건강하게 먹는 법·알아두면 좋은 점은 지금 입력하지 않아도 됩니다.</div>
 <div class="actions"><button onclick="saveAdd()">도감에 저장</button><button class="alt" onclick="closeModal()">취소</button></div>`);
}
function resizeImage(data,max,q,done){
 const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>max){h=Math.round(h*max/w);w=max}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);done(c.toDataURL("image/jpeg",q))};im.src=data;
}
function saveAdd(){
 const name=$("a_name").value.trim();if(!name){alert("음식 이름을 먼저 입력해 주세요.");return}
 const f={id:"u"+Date.now(),name,cat:"새로 발견한 음식",desc:"",ing:"",how:"",health:"",tip:"",photo:"",seen:true,fav:false,
 place:$("a_place").value,feel:$("a_feel").value,again:$("a_again").value,memo:$("a_memo").value.trim()};
 const file=$("a_photo").files[0],finish=()=>{data.unshift(f);save();closeModal();render()};
 if(file){const r=new FileReader();r.onload=()=>resizeImage(r.result,1000,.82,x=>{f.photo=x;finish()});r.readAsDataURL(file)}else finish();
}
function photoForFood(id){
 const f=data.find(x=>x.id===id); if(!f)return;
 openModal(`<h2>📷 사진 등록</h2>
 <p><b>${esc(f.name)}</b>의 사진을 등록해 주세요.</p>
 <div class="photoChoice">
   <button class="photoBig" onclick="cameraInput('${id}')">📷<br><b>아이패드로 사진 촬영</b><span>지금 음식 사진을 찍어요</span></button>
   <button class="photoBig" onclick="libraryInput('${id}')">🖼️<br><b>사진 보관함에서 선택</b><span>이미 찍어둔 사진을 사용해요</span></button>
 </div>
 <div class="infoBox">💡 사진을 등록하면 음식도감에 바로 저장됩니다.<br>기존 사진이 있다면 새 사진으로 교체됩니다.</div>
 <div class="actions"><button class="alt" onclick="detail('${id}')">취소</button></div>`);
}
function cameraInput(id){
 const input=document.createElement("input");
 input.type="file"; input.accept="image/*"; input.setAttribute("capture","environment");
 input.style.display="none";
 input.onchange=()=>handlePhotoFile(id,input.files[0]);
 document.body.appendChild(input);
 input.click();
 setTimeout(()=>input.remove(),1000);
}
function libraryInput(id){
 const input=document.createElement("input");
 input.type="file"; input.accept="image/*";
 input.style.display="none";
 input.onchange=()=>handlePhotoFile(id,input.files[0]);
 document.body.appendChild(input);
 input.click();
 setTimeout(()=>input.remove(),1000);
}
function handlePhotoFile(id,file){
 const f=data.find(x=>x.id===id); if(!f || !file)return;
 const r=new FileReader();
 r.onload=()=>resizeImage(r.result,1000,.82,x=>{f.photo=x;save();render();detail(id)});
 r.readAsDataURL(file);
}
function savePhotoOnly(id){
 const input=document.createElement("input");
 input.type="file"; input.accept="image/*";
 input.onchange=()=>handlePhotoFile(id,input.files[0]);
 input.click();
}
function parent(){
 const pin=prompt("부모님 모드 PIN을 입력하세요.");
 if(pin==="1234"){parentMode=!parentMode;alert(parentMode?"부모님 모드가 켜졌어요.":"부모님 모드가 꺼졌어요.");render()}
 else alert("PIN이 맞지 않아요.");
}
function editFood(id){
 const f=data.find(x=>x.id===id);if(!f)return;
 openModal(`<h2>✏️ 부모님 설명 보완</h2>
 <div class="infoBox">👧 아이가 기록한 내용<br>장소: ${esc(f.place||"기록 없음")}<br>느낌: ${esc(f.feel||"기록 없음")}<br>다시 먹기: ${esc(f.again||"기록 없음")}<br>한마디: ${esc(f.memo||"기록 없음")}</div>
 ${editField("e_desc","음식 설명",f.desc)}${editField("e_ing","주재료",f.ing)}${editField("e_how","어떻게 만들까요?",f.how)}${editField("e_health","건강하게 먹는 법",f.health)}${editField("e_tip","알아두면 좋은 점",f.tip)}
 <div class="field"><label>📂 카테고리</label><input id="e_cat" value="${esc(f.cat||"새로 발견한 음식")}"></div>
 <div class="field"><label>📷 사진 교체</label><input id="e_photo" type="file" accept="image/*" capture="environment"></div>
 <div class="actions"><button onclick="saveEdit('${f.id}')">저장</button><button class="alt" onclick="detail('${f.id}')">취소</button></div>`);
}
function editField(id,label,val){return `<div class="field"><label>${label}</label><textarea id="${id}">${esc(val||"")}</textarea></div>`}
function saveEdit(id){
 const f=data.find(x=>x.id===id);if(!f)return;
 f.desc=$("e_desc").value.trim();f.ing=$("e_ing").value.trim();f.how=$("e_how").value.trim();f.health=$("e_health").value.trim();f.tip=$("e_tip").value.trim();f.cat=$("e_cat").value.trim()||"새로 발견한 음식";
 const file=$("e_photo").files[0];
 const finish=()=>{save();detail(id);render()};
 if(file){const r=new FileReader();r.onload=()=>resizeImage(r.result,1000,.82,x=>{f.photo=x;finish()});r.readAsDataURL(file)}else finish();
}
function deleteFood(id){
 if(!confirm("이 음식을 도감에서 삭제할까요?"))return;
 data=data.filter(x=>x.id!==id);save();closeModal();render();
}
function backup(){
 const blob=new Blob([JSON.stringify(data)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="어린이음식도감_백업.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$("addBtn").onclick=addFood;$("parentBtn").onclick=parent;$("backupBtn").onclick=backup;
render();
</script>
</body>
</html>
